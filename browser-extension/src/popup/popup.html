<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- State 1: Logged out -->
  <div id="view-login" class="view">
    <header>
      <span class="logo-main">Dienynas</span><span class="logo-accent">SYNC</span>
    </header>
    <div class="form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <button id="btn-login">Sign in</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <!-- States 2 + 3: Logged in -->
  <div id="view-main" class="view hidden">
    <header>
      <span class="logo-main">Dienynas</span><span class="logo-accent">SYNC</span>
    </header>
    <div class="user-row">
      <span id="user-email" class="user-email"></span>
      <button id="btn-logout" class="link-btn">Log out</button>
    </div>
    <p id="sync-status" class="status-idle"></p>
    <button id="btn-sync">Sync now</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
